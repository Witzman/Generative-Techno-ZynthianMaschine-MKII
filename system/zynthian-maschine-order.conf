# Installed as /etc/systemd/system/zynthian.service.d/10-maschine-order.conf
#
# Zynthian's UI must start AFTER the Maschine daemon. Start the daemon alone
# after the UI is already up and a2jmidid re-registers its port on a NEW zmip
# slot while the ctrldev driver stays bound to the dead one: the rig goes
# silent, with no error in any log. That is the worst failure mode this
# instrument has, and until now the ordering was enforced only by prose - in
# CLAUDE.md, in notes/traps/DEPLOYING.md and in one line of deploy-to-pi.sh,
# three places a person can not-read.
#
# A DROP-IN, not a patch to zynthian.service. The unit is Zynthian's, so per
# working rule 9 this repository does not edit it. A drop-in also survives a
# ZynthianOS update by construction: an update rewrites zynthian.service and
# leaves zynthian.service.d/ alone, so unlike patch-autoconnect-maschine.py
# there is nothing to re-run afterwards.
#
# Wants=, deliberately NOT Requires=. Requires would tie the UI's fate to the
# daemon's, and 99-maschine.rules stops the daemon when the controller is
# unplugged - so unplugging the MK2 mid-set would take the whole instrument
# down with it. Wants= pulls the daemon in at boot and orders it first without
# making the UI depend on it.
#
# PartOf= was considered and rejected for the same reason from both ends: it
# would make a daemon stop stop the UI (unplug kills the rig) and a daemon
# restart restart the UI (replug throws away unsaved state). The udev rule
# fires both of those on ordinary cable handling.
#
# WHAT THIS DOES NOT FIX: a human typing `systemctl restart maschine-mk2` on
# its own, after boot. systemd cannot express "restart me too" without also
# expressing "stop me too", which the unplug rule makes unsafe. Boot ordering
# is now structural; the hand-restart order is still prose plus
# tools/deploy-to-pi.sh, which always does it correctly.

[Unit]
After=maschine-mk2.service
Wants=maschine-mk2.service

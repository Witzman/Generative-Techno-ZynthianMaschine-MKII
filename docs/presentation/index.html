<!doctype html>

<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Foliennavigation">

      <nav id="slide-nav"></nav>
      <div class="sidebar-help">← → navigieren<br>O Übersicht · F Vollbild</div>
    </aside>
    <main class="stage">
      <div class="stage-bar"><span id="section-label">AUSGANGSLAGE</span><span><span id="counter">01</span> / 14</span></div>
      <section id="deck" aria-live="polite"></section>
      <div class="progress"><i id="progress-bar"></i></div>
      <div class="controls"><button id="prev" aria-label="Vorherige Folie">←</button><button id="next" aria-label="Nächste Folie">→</button><button id="overview" aria-label="Übersicht">☷</button></div>
    </main>
  </div>
  <script>
    const asset = name => `assets/${name}`;
    const allSlides = [
      {section:'AUSGANGSLAGE', kicker:'CHAOSTREFF · 10. OKTOBER 2026', title:'Tot. Dann kam<br><em>der Auftrag.</em>', lead:'Ein Projektmanager, eine KI und EOL Hardware', hero:'hero'},
      {section:'AUSGANGSLAGE', kicker:'DAS GERÄT', title:'Ein Controller, der<br>mehr sein wollte.', image:'Frame-00246.png', body:'16 Pads · 8 Encoder · 2 Displays · 2×8 Gruppen-LEDs', caption:'Native Instruments Maschine MK2 — gebaut für Software, heute offen für neue Ideen.'},
      {section:'AUSGANGSLAGE', kicker:'DIE AUSGANGSFRAGE', title:'Wegwerfen<br>oder weiterleben?', quote:'Kein Herstellersupport mehr.\nAber ein großartiges Gerät.', body:'Die Hardware ist da. Die USB-Verbindung funktioniert. Nur die ursprüngliche Welt dahinter ist verschwunden.', dark:true},
      {section:'ZYNTHIAN', kicker:'EINE OFFENE PLATTFORM', title:'Zynthian ist Linux<br>als Synthesizer.', body:'Raspberry Pi 4 · ZynthianOS · zynseq · Python', bullets:['offene Software statt Black Box','Snapshots speichern Instrument und Pattern','Controller-Treiber sind erweiterbare Python-Module'], image:'zynthian-hero.jpg', caption:'Zynthian V5 — Raspberry Pi, Open Hardware und freie Software. Quelle: <a href="https://www.zynthian.org/" target="_blank" rel="noopener">zynthian.org</a>'},
      {section:'ZYNTHIAN', kicker:'WARUM DAS PASST', title:'Die richtigen<br>Steckstellen sind offen.', body:'Die Maschine muss keine Zynthian-Oberfläche imitieren. Sie darf eine eigene Oberfläche für denselben Sequencer werden.', chips:['Python-Treiber','zynseq','Snapshots','Linux'], image:'zynthian-use-case.jpg', image2:'zynthian-use-case-2.jpg', visual:'fit', caption:'Zynthian als offenes Instrument — Use-Case-Fotos der offiziellen Projektseite.'},
      {section:'DER ALTE TREIBER', kicker:'FUNDSTÜCK', title:'Im Netz gab es<br>schon einen Versuch.', body:'Ein alter MK2-Treiber für Zynthian: genug, um Hoffnung zu machen — nicht genug, um das Gerät zu spielen.', image:'generated-reverse-engineering.png', visual:'search', caption:'Reverse Engineering beginnt mit einem Signal, einer Hypothese und viel Geduld. Generierte Illustration.'},
      {section:'DER ALTE TREIBER', kicker:'BESTANDSAUFNAHME', title:'Ein paar Pads gingen.<br>Der Rest blieb stumm.', columns:[['GING','Pads','Noten'],['FEHLTE','Buttons','Encoder','Displays','LEDs']], visual:'status'},
      {section:'DER ALTE TREIBER', kicker:'DIE URSACHE', title:'Das HID-Protokoll<br>war nur halb erzählt.', body:'USB HID liefert Rohdaten. Der alte Treiber kannte einen kleinen Ausschnitt davon. Der Rest des Geräts war kein Defekt — nur unbeschriebene Sprache.', code:'HID → ??? → Zynthian', visual:'hid'},
      {section:'DIE ZWISCHENSCHICHT', kicker:'ARCHITEKTUR', title:'Eine Übersetzungsschicht<br>zwischen zwei Welten.', diagram:'architecture', image:'generated-translation-layer.png', caption:'Vom physischen Event zur musikalischen Bedeutung. Generierte Illustration.'},
      {section:'DIE ZWISCHENSCHICHT', kicker:'DER DAEMON', title:'Erst einmal: Bytes<br>in Ereignisse verwandeln.', body:'Der Rust-Daemon liest USB HID, trennt Eingaben und Ausgaben und reicht stabile Events weiter.', code:'USB report  →  button / encoder / pad  →  event', visual:'daemon'},
      {section:'DIE ZWISCHENSCHICHT', kicker:'REVERSE ENGINEERING', title:'Display-Protokolle<br>geben ihre Geheimnisse preis.', image:'9UyT8l2.jpeg', body:'Nicht dokumentiert. Nicht magisch. Ein Signal verändern, ein Byte suchen, eine Hypothese testen.', caption:'Das Display als Messinstrument: Parameter werden sichtbar, bevor der Code sie versteht.'},
      {section:'DIE ZWISCHENSCHICHT', kicker:'REVERSE ENGINEERING', title:'LEDs: eine nach<br>der anderen.', image:'bj1JJTl.jpeg', body:'LED-Position, Farbe und Helligkeit aus dem Datenstrom isolieren. Dann den nächsten Schritt suchen.', caption:'Die Gruppen-LEDs werden zu acht sichtbaren Kanälen.'},
      {section:'DIE ZWISCHENSCHICHT', kicker:'IN DEN SEQUENCER', title:'Der Treiber schreibt<br>in zynseq.', body:'Patterns liegen in Snapshots. Der Touchscreen spiegelt die Pads. Die Maschine wird zur physischen Oberfläche eines offenen Sequencers.', diagram:'inject'},
      {section:'DIE ZWISCHENSCHICHT', kicker:'ZWISCHENSTAND', title:'Jetzt ist der Controller<br>vollständig nutzbar.', body:'Buttons. Encoder. Displays. LEDs. Pads. Alles spricht mit Zynthian.', quote:'Aber ein Controller<br>ist noch kein Instrument.', dark:true},
      {section:'VOM CONTROLLER ZUM INSTRUMENT', kicker:'DIE IDEE', title:'Nicht den Beat zeichnen.<br>Ein Muster erzeugen.', body:'Die Oberfläche soll nicht nur abspielen, was vorher programmiert wurde. Sie soll musikalische Entscheidungen anbieten.', image:'generated-generative-instrument.png', visual:'spark', caption:'Ein Instrument, dessen Pattern sich bewegt, ohne die Hand aus dem Spiel zu nehmen. Generierte Illustration.'},
      {section:'VOM CONTROLLER ZUM INSTRUMENT', kicker:'EURORACK-KONZEPTE', title:'Aus dem Modularbereich<br>geborgt — und übersetzt.', chips:['Euklidische Rhythmen','Turing-Machine','LFO','Wahrscheinlichkeit'], image:'vcv-rack-dark.webp', image2:'vcv-rack-selection.webp', visual:'modular', caption:'VCV Rack als Denk- und Experimentierumgebung für modulare Konzepte. Quelle: <a href="https://vcvrack.com/Rack" target="_blank" rel="noopener">vcvrack.com/Rack</a>'},
      {section:'VOM CONTROLLER ZUM INSTRUMENT', kicker:'EUCLID + TURING · LIVE', title:'Drei Spuren.<br>Ein Generator.', body:'Kick und Snare verteilen ihre Schläge euklidisch. Der Bass wandert als Turing-Stimme darunter. Anklicken, SOUND drücken, zuhören.', visual:'generatorInteractive'},
      {section:'VOM CONTROLLER ZUM INSTRUMENT', kicker:'DIE ENTSCHEIDUNG', title:'Der Generator besitzt<br>das Pattern.', body:'Acht Kanäle sind immer aktiv. Nichts wird während des Spielens erzeugt oder abgebaut. Live-Pad und Overdub liegen obendrauf.', visual:'ownership'},
      {section:'VOM CONTROLLER ZUM INSTRUMENT', kicker:'DIE OBERFLÄCHE', title:'Vier Modi. Ein<br>ALL-Lens.', chips:['CONTROL','STEP','AUTO','VOLUME'], image:'vUadLn5.jpeg', caption:'Jeder Modus zeigt denselben musikalischen Zustand aus einer anderen Nähe.'},
      {section:'DEMO & FAZIT', kicker:'JETZT LIVE', title:'Die Maschine spielt<br>nicht aus der Aufzeichnung.', image:'Frame-00246.png', body:'Live-Demo am Rig. Wenn etwas ausfällt, bleibt die Erklärung: Der Generator besitzt das Pattern.', badge:'LIVE DEMO'},
      {section:'DEMO & FAZIT', kicker:'WAS HÄNGT', title:'Alte Hardware<br>ist selten tot.', bullets:['Offene Plattform schlägt Neukauf, wenn die Schnittstellen offen sind.','Reverse Engineering ist Geduld, nicht Magie.','Ein gutes Protokoll ist nur der Anfang — eine gute Oberfläche macht ein Instrument.'], visual:'lessons'},
      {section:'DEMO & FAZIT', kicker:'OFFEN FÜR MITMACHEN', title:'Das Projekt ist<br>noch nicht fertig.', links:['github.com/Witzman/ZynthianMaschine-Workshop','witzman.de/dub/'], body:'Treiber verbessern · Hardware testen · Snapshots bauen · Ideen einbringen', visual:'open'},
      {section:'DEMO & FAZIT', kicker:'DANKE', title:'Fragen?', lead:'Was würdet ihr aus einem Controller machen, dessen Hersteller längst aufgehört hat?', image:'bj1JJTl.jpeg', caption:'Maschine MK2 × Zynthian · Linux · Reverse Engineering · generative Musik'}
    ];
    const slides = [0,1,3,5,6,8,10,12,14,16,18,20,21,22].map(i => allSlides[i]);
    const nav = document.querySelector('#slide-nav'), deck = document.querySelector('#deck');
    const menuToggle=document.querySelector('#menu-toggle'); menuToggle.onclick=()=>{const open=document.body.classList.toggle('menu-collapsed'); menuToggle.setAttribute('aria-expanded',String(!open)); menuToggle.querySelector('span').textContent=open?'OPEN':'MENU';};
    const groups = [...new Set(slides.map(s=>s.section))];
    groups.forEach(g => { const label=document.createElement('div'); label.className='nav-group'; label.innerHTML=`<button type="button" aria-expanded="true"><span>${g}</span><b>⌄</b></button>`; nav.append(label); const toggle=label.querySelector('button'); toggle.onclick=()=>{ const open=toggle.getAttribute('aria-expanded')==='true'; toggle.setAttribute('aria-expanded',String(!open)); let next=label.nextElementSibling; while(next && !next.classList.contains('nav-group')){ next.hidden=open; next=next.nextElementSibling; } }; slides.forEach((s,i)=>{if(s.section===g){const b=document.createElement('button');b.innerHTML=`<i>${String(i+1).padStart(2,'0')}</i>${s.kicker}`;b.onclick=()=>go(i);b.dataset.index=i;nav.append(b)}})});
    function esc(text){return text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
    function visual(type){
      const pads = (mode) => Array.from({length:16},(_,i)=>`<button type="button" class="mini-pad ${mode==='euclid' && [0,3,6,9,12].includes(i)?'on':''} ${mode==='snare' && [0,5,10].includes(i)?'on':''} ${mode==='turing' && [0,2,5,8,11,14].includes(i)?'on':''}" data-step="${i}" aria-label="Schritt ${i+1}">${String(i+1).padStart(2,'0')}</button>`).join('');
      const map={
        zynthian:'<div class="stack"><b>Raspberry Pi 4</b><span>Linux / ZynthianOS</span><strong>zynseq</strong><small>offene Synth-Plattform</small></div>',
        fit:'<div class="port-grid"><b>MASCHINE</b><i>USB HID</i><b>ZYNTHIAN</b><i>Python · zynseq · Snapshots</i></div>',
        search:'<div class="search-card"><span>▣</span> MK2 driver<br><small>last update: unknown</small><hr><em>some pads detected</em></div>',
        status:'<div class="status-grid"><b>PAD</b><b class="bad">BUTTON</b><b class="bad">ENCODER</b><b class="bad">DISPLAY</b></div>',
        hid:'<div class="hid"><span>1B 00 7F 2A</span><span>1B 00 7F 2A</span><span>1B 00 81 2A</span><strong>?</strong></div>',
        daemon:'<div class="pulse"><i></i><i></i><i></i><i></i><span>EVENT BUS</span></div>',
        spark:'<div class="spark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>',
        modular:'<div class="modules"><b>EUCLID</b><b>TURING</b><b>LFO</b></div>',
        euclidInteractive:`<div class="interactive-box" data-interactive="euclid"><div class="interactive-head"><span>EUCLID · KICK</span><span><button type="button" class="run-button" data-action="sound">SOUND</button></span></div><div class="mini-grid">${pads('euclid')}</div><div class="interactive-readout"><span>HITS <b data-value="hits">05</b></span><input data-control="hits" type="range" min="1" max="12" value="5"><span>ROTATE <b data-value="rotate">00</b></span><input data-control="rotate" type="range" min="0" max="15" value="0"></div><small>Schläge anklicken · HITS und ROTATE ausprobieren · SOUND startet den Browser-Kick</small></div>`,
        turingInteractive:`<div class="interactive-box" data-interactive="turing"><div class="interactive-head"><span>TURING · BASS</span><span><button type="button" class="run-button" data-action="sound">SOUND</button> <button type="button" class="run-button" data-action="mutate">MUTATE</button></span></div><div class="mini-grid turing-grid">${pads('turing')}</div><div class="pitch-row">${Array.from({length:16},(_,i)=>`<i style="height:${28+((i*29)%68)}%" data-pitch="${i}"></i>`).join('')}</div><div class="interactive-readout"><span>MELODY <b data-value="melody">30</b></span><input data-control="melody" type="range" min="0" max="100" value="30"><span>RHYTHM <b data-value="rhythm">30</b></span><input data-control="rhythm" type="range" min="0" max="100" value="30"></div><small>MELODY verändert die Bits · RHYTHM verändert die Schritte · SOUND spielt die Linie</small></div>`,
        generatorInteractive:`<div class="interactive-box generator-box" data-interactive="generator"><div class="interactive-head"><span>GENERATOR · 3 SPUREN</span><button type="button" class="run-button" data-action="sound">SOUND</button></div><div class="lane-row" data-lane="kick"><b>KICK <small>EUCLID</small></b><div class="mini-grid">${pads('euclid')}</div></div><div class="lane-row" data-lane="snare"><b>SNARE <small>EUCLID</small></b><div class="mini-grid">${pads('snare')}</div></div><div class="lane-row" data-lane="bass"><b>BASS <small>TURING</small></b><div class="mini-grid turing-grid">${pads('turing')}</div></div><small>Steps anklicken · alle drei Reihen spielen gemeinsam im 16er-Raster</small></div>`,
        ownership:'<div class="ownership"><strong>GENERATOR</strong><span>⇣ owns ⇣</span><b>PATTERN</b><small>live pad + overdub overlay</small></div>',
        lessons:'<div class="lesson-lines"><span>hardware</span><span>protocol</span><span>instrument</span></div>',
        open:'<div class="open-mark">↗</div>'}; return map[type]||'';
    }
    function diagram(type){ if(type==='architecture') return '<div class="diagram"><b>MASCHINE MK2</b><i>USB HID</i><b>DAEMON <small>Rust</small></b><i>events</i><b>TREIBER <small>Python</small></b><i>notes + state</i><b>ZYNSEQ / ZYNTHIAN</b></div>'; if(type==='inject') return '<div class="inject"><span>PAD</span><b>→</b><span>DRIVER</span><b>→</b><span>ZYNSEQ</span><b>→</b><span>SNAPSHOT</span></div>'; if(type==='euclid') return '<div class="steps">● · ● · ● ● · · ● · ● · ● · · ·</div>'; return '<div class="steps">● ● · ● · ● · · ● ● · · ● · ● ·</div>'; }
    function html(s,i){let content=''; if(s.image) content+=`<figure class="photo"><img src="${asset(s.image)}" alt="${esc(s.title.replace(/<[^>]+>/g,''))}">${s.caption?`<figcaption>${s.caption}</figcaption>`:''}</figure>`; if(s.image2) content+=`<figure class="photo secondary-photo"><img src="${asset(s.image2)}" alt="Zynthian use case"></figure>`; if(s.visual) content+=`<div class="visual">${visual(s.visual)}</div>`; if(s.diagram) content+=diagram(s.diagram); return `<article class="slide ${s.hero?'hero':''} ${s.dark?'dark':''}" data-index="${i}"><div class="slide-inner"><div class="slide-copy"><div class="kicker">${s.kicker}</div><h1>${s.title}</h1>${s.lead?`<p class="lead">${s.lead}</p>`:''}${s.body?`<p>${s.body}</p>`:''}${s.quote?`<blockquote>${esc(s.quote).replace(/\n/g,'<br>')}</blockquote>`:''}${s.bullets?`<ul>${s.bullets.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${s.chips?`<div class="chips">${s.chips.map(x=>`<span>${x}</span>`).join('')}</div>`:''}${s.columns?`<div class="columns">${s.columns.map((c,j)=>`<div class="column ${j?'bad':''}"><b>${c[0]}</b>${c.slice(1).map(x=>`<span>${x}</span>`).join('')}</div>`).join('')}</div>`:''}${s.code?`<code class="code-line">${s.code}</code>`:''}${s.links?`<div class="links">${s.links.map(x=>`<a href="https://${x}" target="_blank">${x}</a>`).join('')}</div>`:''}${s.badge?`<span class="badge">${s.badge}</span>`:''}</div><div class="slide-art">${content}</div></div><div class="slide-number">${String(i+1).padStart(2,'0')}</div></article>`}
    let current=0; deck.innerHTML=slides.map(html).join(''); const els=[...document.querySelectorAll('.slide')];
    let audioContext=null, audioTimer=null, audioStep=0;
    function audio(){ audioContext ||= new (window.AudioContext||window.webkitAudioContext)(); if(audioContext.state==='suspended') audioContext.resume(); return audioContext; }
    function blip(type,step,box){ const ctx=audio(), now=ctx.currentTime; if(type==='euclid'){ const hit=box.querySelectorAll('.mini-pad')[step].classList.contains('on'); if(!hit)return; const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(145,now); o.frequency.exponentialRampToValueAtTime(48,now+.13); g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.32,now+.006); g.gain.exponentialRampToValueAtTime(.0001,now+.16); o.connect(g).connect(ctx.destination); o.start(now); o.stop(now+.18); } else { const pad=box.querySelectorAll('.mini-pad')[step], pitch=box.querySelectorAll('.pitch-row i')[step], active=pad.classList.contains('on'); if(!active)return; const o=ctx.createOscillator(), g=ctx.createGain(); o.type='triangle'; o.frequency.value=110*Math.pow(2,(parseFloat(pitch.style.height||'50')-40)/45); g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.16,now+.012); g.gain.exponentialRampToValueAtTime(.0001,now+.28); o.connect(g).connect(ctx.destination); o.start(now); o.stop(now+.3); } }
    function stopSound(box){ if(audioTimer){clearInterval(audioTimer);audioTimer=null} document.querySelectorAll('.run-button[data-action="sound"]').forEach(b=>b.classList.remove('active')); document.querySelectorAll('.mini-pad.playhead').forEach(p=>p.classList.remove('playhead')); }
    function blipGenerator(step,box){ const ctx=audio(), now=ctx.currentTime; box.querySelectorAll('.lane-row').forEach(row=>{ const pad=row.querySelectorAll('.mini-pad')[step]; if(!pad.classList.contains('on'))return; const o=ctx.createOscillator(), g=ctx.createGain(); const bass=row.dataset.lane==='bass'; const snare=row.dataset.lane==='snare'; o.type=bass?'triangle':'sine'; o.frequency.setValueAtTime(bass?110*Math.pow(2,((step*3)%12)/12):(snare?190:145),now); if(!bass)o.frequency.exponentialRampToValueAtTime(snare?120:48,now+.12); g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(bass?.13:(snare?.1:.28),now+.006); g.gain.exponentialRampToValueAtTime(.0001,now+(bass?.25:.16)); o.connect(g).connect(ctx.destination); o.start(now); o.stop(now+(bass?.28:.18)); }); }
    function startSound(box){ stopSound(box); audioStep=0; const button=box.querySelector('[data-action="sound"]'); button.classList.add('active'); const tick=()=>{box.querySelectorAll('.mini-pad').forEach(p=>p.classList.remove('playhead')); if(box.dataset.interactive==='generator'){box.querySelectorAll('.lane-row').forEach(row=>row.querySelectorAll('.mini-pad')[audioStep].classList.add('playhead'));blipGenerator(audioStep,box);} else {box.querySelectorAll('.mini-pad').forEach((p,i)=>p.classList.toggle('playhead',i===audioStep));blip(box.dataset.interactive,audioStep,box);} audioStep=(audioStep+1)%16}; tick(); audioTimer=setInterval(tick,170); }
    document.querySelectorAll('.interactive-box').forEach(box=>{
      box.querySelectorAll('.mini-pad').forEach(p=>p.addEventListener('click',()=>p.classList.toggle('on')));
      box.querySelector('[data-action="sound"]').addEventListener('click',()=>audioTimer && box.querySelector('[data-action="sound"]').classList.contains('active') ? stopSound(box) : startSound(box));
      box.querySelectorAll('input[data-control]').forEach(input=>input.addEventListener('input',()=>{ const value=box.querySelector(`[data-value="${input.dataset.control}"]`); if(value)value.textContent=String(input.value).padStart(2,'0'); if(input.dataset.control==='hits'){box.querySelectorAll('.mini-pad').forEach((p,i)=>p.classList.toggle('on',i%16 < 0 || i < 16 && (i*input.value)%16 < input.value));} if(input.dataset.control==='melody'){box.querySelectorAll('.pitch-row i').forEach((p,i)=>p.style.height=`${18+((i*31+input.value*2)%78)}%`)} }));
      const mutate=box.querySelector('[data-action="mutate"]'); if(mutate)mutate.addEventListener('click',()=>{box.querySelectorAll('.mini-pad').forEach(p=>p.classList.toggle('on',Math.random()>.58));box.querySelectorAll('.pitch-row i').forEach(p=>p.style.height=`${20+Math.random()*75}%`);});
    });
    document.querySelectorAll('[data-interactive="euclid"]').forEach(box=>{ const repaint=()=>{ const hits=+box.querySelector('[data-control="hits"]').value, rotate=+box.querySelector('[data-control="rotate"]').value; box.querySelectorAll('.mini-pad').forEach((p,i)=>{ const step=(i+rotate)%16; p.classList.toggle('on',Math.floor((step+1)*hits/16)>Math.floor(step*hits/16)); }); }; box.querySelectorAll('[data-control="hits"],[data-control="rotate"]').forEach(input=>input.addEventListener('input',repaint)); repaint(); });
    document.querySelectorAll('[data-interactive="turing"]').forEach(box=>{ const repaint=()=>{ const rhythm=+box.querySelector('[data-control="rhythm"]').value; box.querySelectorAll('.mini-pad').forEach((p,i)=>p.classList.toggle('on',((i*37+rhythm)%100)>42)); }; box.querySelector('[data-control="rhythm"]').addEventListener('input',repaint); repaint(); });
    function go(i){current=Math.max(0,Math.min(slides.length-1,i)); els.forEach((e,n)=>e.classList.toggle('active',n===current)); document.querySelectorAll('#slide-nav button').forEach(b=>b.classList.toggle('active',+b.dataset.index===current)); document.querySelector('#counter').textContent=String(current+1).padStart(2,'0'); document.querySelector('#section-label').textContent=slides[current].section; document.querySelector('#progress-bar').style.width=`${((current+1)/slides.length)*100}%`; history.replaceState(null,'',`#${current+1}`)}
    document.querySelector('#prev').onclick=()=>go(current-1); document.querySelector('#next').onclick=()=>go(current+1); document.querySelector('#overview').onclick=()=>document.body.classList.toggle('overview');
    document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)} if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)} if(e.key.toLowerCase()==='o')document.body.classList.toggle('overview'); if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});
    go(Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1),10)||1)-1)));
  </script>
</body>
</html>
